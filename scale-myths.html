<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第四站｜迷思挑戰｜尺度探險隊</title><style>
:root{--ink:#173b36;--green:#126c5a;--mint:#e4f4ed;--paper:#fafaf5;--gold:#edac4f;--muted:#577068;--line:#c9dfd3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif}header{padding:26px max(22px,calc((100vw - 1080px)/2));background:#f0f7ef;border-bottom:1px solid var(--line)}.eyebrow{letter-spacing:.14em;color:var(--green);font-size:14px;font-weight:bold}.title{font-size:clamp(32px,5vw,54px);margin:8px 0}.subtitle{color:var(--muted);font-size:18px;line-height:1.7}main{max-width:1080px;margin:30px auto;padding:0 22px 60px}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,34px);margin:18px 0;box-shadow:0 5px 18px #18544109}.pill{display:inline-block;background:var(--mint);border-radius:999px;padding:7px 13px;color:var(--green);font-weight:bold}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border-radius:13px;border:1px solid var(--line);background:white;color:var(--ink);padding:12px 17px;font-size:17px}button:hover{border-color:var(--green);background:#f4faf6}button:focus-visible,input:focus-visible{outline:3px solid #d89b39;outline-offset:2px}.primary{background:var(--green);color:white;border-color:var(--green);font-weight:700}.primary:hover{background:#084f41;color:white}.secondary{background:#f1f7f0}.buttonbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.feedback{border-radius:15px;background:#edf6f1;padding:15px 18px;line-height:1.7;margin-top:18px;min-height:55px}.feedback.bad{background:#fff1dd}.hidden{display:none!important}.small{font-size:14px;color:var(--muted)}h2{font-size:27px}h3{font-size:21px}p{line-height:1.75}.meter{height:10px;border-radius:8px;background:#e5eee8;overflow:hidden}.meter>div{height:100%;background:var(--green);transition:width .2s}.choice{display:block;width:100%;text-align:left;margin:9px 0;font-size:19px}.choice[disabled]{opacity:.68;cursor:default}.choice.selected{background:#daf0e4;border-color:var(--green)}.big{font-size:clamp(28px,4.5vw,52px);font-weight:800}.teacher{border-left:5px solid var(--gold);padding-left:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{padding:22px;background:#fff;border:1px solid var(--line);border-radius:18px}.card h3{margin:8px 0}.step{font-size:13px;color:var(--green);letter-spacing:.1em;font-weight:bold}.rankitem{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#fff}.rankitem strong{font-size:20px}.rankitem .arrows{display:flex;gap:5px}.rankitem button{padding:7px 13px}.range{width:100%;accent-color:var(--green)}.zoomdisplay{text-align:center;background:#e9f4ef;border-radius:22px;padding:28px 18px;margin:20px 0}.objects{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.object{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;background:#fff}.object.active{background:#d7efe1;border:2px solid var(--green)}.emoji{font-size:33px}.clock{font-size:44px;font-variant-numeric:tabular-nums;font-weight:800}.warning{color:#a05106}footer{text-align:center;color:var(--muted);padding:28px 10px;font-size:13px}body.projector{font-size:125%}body.projector .title{font-size:64px}body.projector button{font-size:21px}@media(max-width:520px){.rankitem strong{font-size:16px}.rankitem button{padding:5px 10px}.panel{border-radius:15px}.title{font-size:33px}}
</style></head><body><header><div class="eyebrow">七年級自然科・尺度探險隊・獨立活動頁</div><h1 class="title">第四站｜迷思挑戰</h1><div class="subtitle">不是每句看起來像科學的話都正確！學會解釋自己的判斷。</div></header><main><div class="row"><span class="pill">不需登入・離線可用</span><button onclick="document.body.classList.toggle('projector')" aria-label="切換投影大字">投影大字：切換</button></div><section class="panel teacher"><b>教師導入建議</b><p>先請小組投票「正確／不正確／不一定」，再開放按答案。特別討論「一定」等絕對語句。</p></section><section class="panel"><div class="row"><h2>科學偵探：破解常見迷思</h2><span id="number" class="pill"></span></div><div id="statement" class="big" style="font-size:clamp(25px,3vw,37px);padding:22px 0"></div><div class="grid" id="options"><button data-a="正確">✅ 正確</button><button data-a="不正確">❌ 不正確</button><button data-a="不一定">❓ 不一定</button></div><div id="feedback" class="feedback">請先判斷，再看科學解釋。</div><div class="buttonbar"><button class="primary hidden" id="next">下一題 →</button><button id="reset">重新開始</button></div><p class="small" id="score"></p></section></main><footer>尺度探險隊｜每頁獨立運作，學生頁面不提供其他關卡連結。</footer><script>const D=[["病毒一定比所有細菌都小。", "不一定", "常見病毒多數比典型細菌小，但兩者的大小範圍有重疊，不可說「一定」。"], ["1 微米等於 1000 奈米。", "正確", "10⁻⁶ m ÷ 10⁻⁹ m = 10³ = 1000。"], ["放大 100 倍後，物體真正的長度也增加 100 倍。", "不正確", "放大影響影像大小，物體實際尺寸沒有改變。"], ["1 公分比 1 毫米大 10 倍。", "正確", "1 cm = 10 mm。"], ["10⁻⁶ 比 10⁻³ 大，因為 6 比 3 大。", "不正確", "10⁻⁶ = 0.000001，小於 10⁻³ = 0.001。"], ["用奈米描述一間教室的長度，雖可換算但不方便。", "正確", "單位應配合物體尺度，較方便閱讀與溝通。"]];let n=0,s=0,answered=false;const $=id=>document.getElementById(id);function show(){if(n===D.length){$('statement').textContent='恭喜完成全部迷思挑戰！';$('options').classList.add('hidden');$('feedback').textContent=`你答對 ${s}/${D.length} 題。請和同學分享最意外的一個觀念。`;$('next').classList.add('hidden');return}answered=false;$('number').textContent=`第 ${n+1} / ${D.length} 題`;$('statement').textContent=D[n][0];$('feedback').textContent='請選擇你認為正確的判斷。';$('feedback').className='feedback';$('next').classList.add('hidden');$('options').classList.remove('hidden');$('options').querySelectorAll('button').forEach(b=>{b.disabled=false;b.classList.remove('selected')})}$('options').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const good=b.dataset.a===D[n][1];if(good)s++;$('feedback').textContent=`${good?'判斷正確！':'這題的正解是「'+D[n][1]+'」。'} ${D[n][2]}`;$('feedback').className='feedback '+(good?'':'bad');$('options').querySelectorAll('button').forEach(x=>{x.disabled=true;if(x.dataset.a===D[n][1])x.classList.add('selected')});$('score').textContent=`目前答對 ${s} 題`;$('next').classList.remove('hidden')});$('next').onclick=()=>{n++;show()};$('reset').onclick=()=>{n=0;s=0;$('score').textContent='';show()};show();</script></body></html>
